# ============================================
# Конфигурация тестового окружения
# ============================================

# Базовый URL веб-приложения (для UI-тестов)
base.url=https://the-internet.herokuapp.com

# Базовый URI API (для REST-тестов)
api.base.uri=https://reqres.in
api.base.path=/api

# Таймауты (в секундах)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Учётные данные для тестов (НЕ храни реальные пароли в репозитории!)
test.username=tomsmith
test.password=SuperSecretPassword!

# Настройки браузера
browser=chrome
headless=false
window.maximize=true
